name: Rebuild feed

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Optional country code"
        required: false
        default: ""

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: rebuild-feed-main
  cancel-in-progress: false

jobs:
  rebuild-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_OWNER: jeep-jim
      GITHUB_REPO: margelet
      GITHUB_BRANCH: main
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      MARGELET_STORAGE_MODE: local
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest repo state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild feed snapshot
        run: |
          COUNTRY="${{ github.event.inputs.country }}"

          if [ -n "$COUNTRY" ]; then
            npm run rebuild:feed -- --country="$COUNTRY"
          else
            npm run rebuild:feed
          fi

      - name: Commit rebuilt files
        run: |
          git config user.name "jeep-jim"
          git config user.email "yokkey@ya.ru"

          git add -A \
            data/feed.json \
            public/feed.json \
            data/sources.json \
            data/placements.json \
            data/feeds \
            public/feeds \

          echo "Deploy triggered at $(date)" > force-deploy.txt
          git add force-deploy.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "rebuild feed: data update"
          git pull --rebase origin main || true
          git push

      - name: Purge Cloudflare cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["www.margelet.space/feeds","margelet.space/feeds"]}'

      - name: Warm Cloudflare feed cache
        run: |
          BASE_URL="https://www.margelet.space"

          URLS=(
            "$BASE_URL/feeds/index.json"
            "$BASE_URL/feeds/ae.json"
            "$BASE_URL/feeds/ar.json"
            "$BASE_URL/feeds/co.json"
            "$BASE_URL/feeds/de.json"
            "$BASE_URL/feeds/eg.json"
            "$BASE_URL/feeds/us.json"
            "$BASE_URL/feeds/es.json"
            "$BASE_URL/feeds/ir.json"
            "$BASE_URL/feeds/fr.json"
            "$BASE_URL/feeds/id.json"
            "$BASE_URL/feeds/in.json"
            "$BASE_URL/feeds/it.json"
            "$BASE_URL/feeds/kz.json"
            "$BASE_URL/feeds/my.json"
            "$BASE_URL/feeds/mx.json"
            "$BASE_URL/feeds/ng.json"
            "$BASE_URL/feeds/pk.json"
            "$BASE_URL/feeds/br.json"
            "$BASE_URL/feeds/ru.json"
            "$BASE_URL/feeds/sa.json"
            "$BASE_URL/feeds/tr.json"
            "$BASE_URL/feeds/ua.json"
            "$BASE_URL/feeds/uz.json"
            "$BASE_URL/feeds/za.json"
            "$BASE_URL/feeds/cn.json"
          )

          for url in "${URLS[@]}"; do
            echo "Warming $url"
            curl -sS -L -o /dev/null "$url" || true
          done