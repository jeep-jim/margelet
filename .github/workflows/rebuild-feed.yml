name: Rebuild feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

permissions:
  contents: write

jobs:
  rebuild-feed:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.MARGELET_GITHUB_TOKEN }}
      GITHUB_OWNER: jeep-jim
      GITHUB_REPO: margelet
      GITHUB_BRANCH: main
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show workflow version
        run: echo "workflow version = npm-install-v2"

      - name: Force npm registry
        run: |
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Rebuild feed snapshot
        run: npx tsx scripts/rebuild-feed.ts

      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/feed.json public/feed.json data/sources.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "rebuild feed"
          git push