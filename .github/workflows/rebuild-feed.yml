name: Rebuild feed

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Optional country code"
        required: false
        default: ""
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  group: rebuild-feed-main
  cancel-in-progress: false

jobs:
  rebuild-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_OWNER: jeep-jim
      GITHUB_REPO: margelet
      GITHUB_BRANCH: main
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      MARGELET_STORAGE_MODE: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Show workflow version
        run: echo "workflow version = github-lite-v6-feed-only-safe-rebuild"

      - name: Sync latest main before rebuild
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: npm ci

      - name: Rebuild feed snapshot
        run: |
          COUNTRY="${{ github.event.inputs.country }}"
          if [ -n "$COUNTRY" ]; then
            npm run rebuild:feed -- --country="$COUNTRY"
          else
            npm run rebuild:feed
          fi

      - name: Commit rebuilt feed files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Важно: автосборка НЕ должна коммитить data/sources.json.
          # Этот файл меняет админка, иначе ловим конфликт и можем снести фид.
          git checkout -- data/sources.json || true

          git add \
            data/feed.json \
            public/feed.json \
            data/feeds \
            public/feeds

          if git diff --cached --quiet; then
            echo "No feed changes to commit"
            exit 0
          fi

          git commit -m "rebuild feed"
          git pull --rebase origin main
          git push
