  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (!window.__MARGELET_ADMIN_PATH__) {
        document.write('<div class="gtranslate_wrapper" aria-hidden="true"></div>');
      }
    </script>

    <style>
      .gtranslate_wrapper {
        position: fixed !important;
        left: -10000px !important;
        bottom: 0 !important;
        z-index: -1 !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        clip: rect(0 0 0 0) !important;
        clip-path: inset(50%) !important;
      }

      .gtranslate_wrapper select {
        display: block !important;
        width: 1px !important;
        height: 1px !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      .gt_float_switcher,
      .gt_switcher,
      .gt_container,
      .gt_options,
      .goog-te-gadget,
      .goog-te-gadget *,
      .goog-te-banner-frame,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip *,
      #goog-gt-tt,
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      .skiptranslate:not(.goog-te-combo),
      .VIpgJd-ZVi9od-aZ2wEe,
      .VIpgJd-ZVi9od-aZ2wEe *,
      .VIpgJd-yAWNEb-L7lbkb,
      .VIpgJd-yAWNEb-L7lbkb *,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-ORHb-OEVmcd *,
      .VIpgJd-ZVi9od-xl07Ob-OEVmcd,
      .VIpgJd-ZVi9od-xl07Ob-OEVmcd * {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      body {
        top: 0 !important;
      }
    </style>

    <script>
      (function () {
        if (window.__MARGELET_ADMIN_PATH__) return;

        function protectNode(node) {
          node.classList.add('notranslate');
          node.setAttribute('translate', 'no');
        }

        function protectMargeletUi(root) {
          if (!root || !root.querySelectorAll) return;

          var selectors = [
            'header',
            'nav',
            'button',
            'select',
            'input',
            'textarea',
            '[role="button"]',
            '[aria-label]',
            '.margelet-ui',
            '.notranslate'
          ];

          root.querySelectorAll(selectors.join(',')).forEach(protectNode);

          root.querySelectorAll('*').forEach(function (node) {
            if (node.closest && node.closest('.margelet-translatable')) return;
            if (node.querySelector && node.querySelector('.margelet-translatable')) return;

            var text = (node.textContent || '').trim();
            if (text === 'margeleT' || text === 'маргелеТ' || text === 'МаргелеТ') {
              protectNode(node);
            }
          });
        }

        function hideGTranslateChrome(root) {
          var scope = root && root.querySelectorAll ? root : document;
          var selectors = [
            '.gtranslate_wrapper',
            '.gt_float_switcher',
            '.gt_switcher',
            '.gt_container',
            '.gt_options',
            '.goog-te-gadget',
            '.goog-te-banner-frame',
            '.goog-te-balloon-frame',
            '.goog-tooltip',
            '#goog-gt-tt',
            'iframe.goog-te-banner-frame',
            'iframe.skiptranslate',
            '.VIpgJd-ZVi9od-aZ2wEe',
            '.VIpgJd-yAWNEb-L7lbkb',
            '.VIpgJd-ZVi9od-ORHb-OEVmcd',
            '.VIpgJd-ZVi9od-xl07Ob-OEVmcd'
          ];

          scope.querySelectorAll(selectors.join(',')).forEach(function (node) {
            node.setAttribute('aria-hidden', 'true');
            node.style.setProperty('display', 'none', 'important');
            node.style.setProperty('visibility', 'hidden', 'important');
            node.style.setProperty('opacity', '0', 'important');
            node.style.setProperty('pointer-events', 'none', 'important');
            node.style.setProperty('left', '-10000px', 'important');
            node.style.setProperty('top', 'auto', 'important');
            node.style.setProperty('bottom', '0', 'important');
            node.style.setProperty('z-index', '-1', 'important');
          });

          scope.querySelectorAll('img, svg, div').forEach(function (node) {
            var text = (node.textContent || '').trim();
            var src = node.getAttribute && (node.getAttribute('src') || '');
            var cls = node.className ? String(node.className) : '';

            if (
              src.indexOf('translate') !== -1 ||
              src.indexOf('gtranslate') !== -1 ||
              cls.indexOf('VIpgJd') !== -1 ||
              text === 'Google Translate'
            ) {
              node.style.setProperty('display', 'none', 'important');
              node.style.setProperty('visibility', 'hidden', 'important');
              node.style.setProperty('opacity', '0', 'important');
              node.style.setProperty('pointer-events', 'none', 'important');
            }
          });
        }

        window.__MARGELET_HIDE_GTRANSLATE_CHROME__ = hideGTranslateChrome;
        window.__MARGELET_PROTECT_TRANSLATE_UI__ = function (root) {
          protectMargeletUi(root);
          hideGTranslateChrome(document);
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            window.__MARGELET_PROTECT_TRANSLATE_UI__?.(document);
          });
        } else {
          window.__MARGELET_PROTECT_TRANSLATE_UI__?.(document);
        }

        var protectScheduled = false;
        var observer = new MutationObserver(function () {
          if (protectScheduled) return;
          protectScheduled = true;

          window.requestAnimationFrame(function () {
            protectScheduled = false;
            window.__MARGELET_PROTECT_TRANSLATE_UI__?.(document);
          });
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true
        });

        window.setInterval(function () {
          window.__MARGELET_HIDE_GTRANSLATE_CHROME__?.(document);
        }, 700);
      })();
    </script>

    <script>
      if (!window.__MARGELET_ADMIN_PATH__) {
        window.gtranslateSettings = {
          default_language: "auto",
          native_language_names: true,
          languages: [
            "en",
            "ru",
            "uk",
            "hi",
            "fa",
            "tr",
            "pt",
            "kk",
            "uz",
            "ar",
            "ur",
            "id",
            "es",
            "it",
            "fr",
            "de",
            "zh-CN",
            "ms"
          ],
          wrapper_selector: ".gtranslate_wrapper"
        };

        var gtranslateScript = document.createElement("script");
        gtranslateScript.src = "https://cdn.gtranslate.net/widgets/latest/dropdown.js";
        gtranslateScript.defer = true;
        document.body.appendChild(gtranslateScript);
      }
    </script>
